<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
  <script>
    // Añade la hora actual (?t=...) para prohibir cualquier caché del navegador
    const url = "https://gist.githubusercontent.com/TU_USUARIO/TU_ID/raw/t.txt?t=" + Date.now();

    fetch(url)
      .then(r => r.text())
      .then(texto => navigator.clipboard.writeText(texto));
  </script>
</body>
</html>
