<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
  <script>
    const texto = `AQUÍ_TU_TEXTO`;

    // Comprobamos si esta ventana ya es una secundaria abierta por script
    if (window.opener) {
      navigator.clipboard.writeText(texto).then(() => {
        window.close(); // Aquí Chrome SÍ permite el cierre automático
      });
    } else {
      // Si la abriste tú a mano, abre la versión que se autocierra y redirige esta a Google
      window.open(window.location.href, '_blank', 'width=100,height=100');
      window.location.replace("https://www.google.com");
    }
  </script>
</body>
</html>
